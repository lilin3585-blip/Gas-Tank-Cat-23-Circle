<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赛博提取器 · 云端 AI 转写</title>
  <style>
    *, *::before, *::after {
      font-family: "WenJinMincho", "Noto Serif SC", "Times New Roman", "明朝", "KaiTi", serif !important;
      box-sizing: border-box;
    }

    body {
      background: #f9f7f2; color: #2e2b28; line-height: 1.5; padding: 1.5rem;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 0;
    }

    .site-wrapper {
      max-width: 800px; width: 100%; background: #ffffffdd; backdrop-filter: blur(8px);
      border-radius: 2.5rem; box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
      padding: 2.5rem 2rem; border: 1px solid #ebe5db;
    }

    h1 { font-size: 2rem; color: #3b3229; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 10px; }
    .subhead { color: #6e6254; margin-bottom: 2rem; font-size: 0.95rem; border-left: 4px solid #cbb9a4; padding-left: 1rem; }

    .control-panel { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .form-group { flex: 1; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #8c7b68; font-weight: bold;}
    .form-group select { width: 100%; border: 1.5px solid #d9cfc0; border-radius: 1rem; padding: 0.8rem 1.2rem; font-size: 1rem; outline: none; background: #fefcf8; }

    .upload-box {
      border: 2px dashed #d9cfc0; border-radius: 1.5rem; padding: 2rem 1rem; text-align: center; background: #fefcf8; cursor: pointer; transition: 0.2s; position: relative; margin-bottom: 1.5rem;
    }
    .upload-box:hover { border-color: #a8886a; background: #faf6f0; }
    .upload-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .upload-icon { font-size: 2.5rem; margin-bottom: 0.5rem; color: #a8886a; }

    .btn-start { width: 100%; border: none; border-radius: 40px; padding: 1rem; font-size: 1.1rem; font-weight: bold; cursor: pointer; background: #5f4e3c; color: white; margin-bottom: 1.5rem; transition: 0.2s; }
    .btn-start:hover { background: #3e3329; }
    .btn-start:disabled { background: #b1a392; cursor: not-allowed; }

    .result-box {
      background: #faf6f0; border-radius: 1.5rem; padding: 1.5rem; border: 1px solid #e6ddd2; min-height: 150px; position: relative; display: none;
    }
    .result-text { font-size: 1.1rem; line-height: 1.8; color: #2e2b28; white-space: pre-wrap; outline: none; max-height: 400px; overflow-y: auto; }
    
    .status { text-align: center; font-weight: bold; color: #a8886a; margin-bottom: 1rem; display: none; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(168,136,106,0.3); border-radius: 50%; border-top-color: #a8886a; animation: spin 1s ease-in-out infinite; margin-right: 10px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="site-wrapper">
    <h1>⚡ 赛博提取器 (云端版)</h1>
    <div class="subhead">无需麦克风。上传视频/音频，调用云端 AI 瞬间提取文本。</div>

    <div class="control-panel">
      <div class="form-group">
        <label>识别任务类型</label>
        <select id="taskType">
          <option value="transcribe">转写原文 (保留原本语言)</option>
          <option value="translate">翻译成英文 (所有语言转英文)</option>
        </select>
      </div>
    </div>

    <div class="upload-box">
      <div class="upload-icon">📁</div>
      <div style="font-weight: bold; color: #5f4e3c;" id="fileName">点击选择视频或音频文件</div>
      <div style="font-size: 0.85rem; color: #b1a392; margin-top: 5px;">支持 MP4, MOV, MP3, WAV 等格式</div>
      <input type="file" id="mediaInput" accept="video/*,audio/*">
    </div>

    <button class="btn-start" id="startBtn" disabled>🚀 开始 AI 转写</button>

    <div class="status" id="statusMsg"><span class="spinner"></span>正在上传并处理中，请勿刷新...</div>

    <div class="result-box" id="resultBox">
      <div class="result-text" id="resultText"></div>
    </div>
  </div>

  <script>
    const mediaInput = document.getElementById('mediaInput');
    const fileName = document.getElementById('fileName');
    const startBtn = document.getElementById('startBtn');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');
    const statusMsg = document.getElementById('statusMsg');
    const taskType = document.getElementById('taskType');

    let selectedFile = null;

    mediaInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        selectedFile = file;
        fileName.textContent = `已选择: ${file.name} (${(file.size / 1024 / 1024).toFixed(1)} MB)`;
        fileName.style.color = "#2e6b2e";
        startBtn.disabled = false;
        resultBox.style.display = 'none';
      }
    });

    startBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      startBtn.disabled = true;
      statusMsg.style.display = 'block';
      resultBox.style.display = 'none';
      
      const formData = new FormData();
      formData.append("file", selectedFile);
      formData.append("model", "whisper-large-v3"); 
      formData.append("task", taskType.value);

      try {
        // ⚠️⚠️⚠️ 注意：请把下面这行里的 gsk_... 换成你刚才在 console.groq.com 申请的真实 Key ⚠️⚠️⚠️
        const GROQ_API_KEY = "gsk_YOUR_GROQ_API_KEY_HERE"; 

        const response = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`
          },
          body: formData
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || "API 请求失败，请检查 Key 是否正确。");
        }

        const data = await response.json();
        
        statusMsg.style.display = 'none';
        resultBox.style.display = 'block';
        resultText.innerText = data.text;

      } catch (error) {
        statusMsg.style.display = 'none';
        alert("出错了: " + error.message);
      } finally {
        startBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
